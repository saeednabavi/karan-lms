version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: run.py
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lms
      SECRET_KEY: dev-secret
      JWT_SECRET_KEY: jwt-dev-secret
    depends_on:
      - postgres
    command: sh -c "alembic upgrade head 2>/dev/null || true && python run.py"

volumes:
  postgres_data:
